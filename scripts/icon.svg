    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke-width="16" stroke-linecap="round" filter="url(#glow)">
    <ellipse cx="256" cy="256" rx="170" ry="62" stroke="#4cc9f0"/>
    <ellipse cx="256" cy="256" rx="170" ry="62" stroke="#ffb02e" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="170" ry="62" stroke="#b388ff" transform="rotate(120 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="50" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="426" cy="256" r="18" fill="#4cc9f0" filter="url(#glow)"/>
</svg>
