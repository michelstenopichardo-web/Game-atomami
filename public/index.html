<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Atomami</title>
  <meta name="description" content="Atomami: duelo de estrategia por turnos. Juega online con amigos, contra la IA o en el mismo iPhone.">
  <meta name="theme-color" content="#0b0d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atomami">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ============ HOME ============ -->
    <section id="screen-home" class="screen active">
      <div class="home-top">
        <button class="chip" id="btn-lang" aria-label="Language">ES</button>
        <button class="chip" id="btn-sound" aria-label="Sound">🔊</button>
      </div>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 120 120" class="logo-atom">
          <defs>
            <radialGradient id="lg-core" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#fff3c4"/>
              <stop offset="55%" stop-color="#ffb02e"/>
              <stop offset="100%" stop-color="#b35a00"/>
            </radialGradient>
          </defs>
          <g fill="none" stroke-width="3">
            <ellipse cx="60" cy="60" rx="52" ry="18" stroke="#4cc9f0" opacity=".9"/>
            <ellipse cx="60" cy="60" rx="52" ry="18" stroke="#ffb02e" opacity=".9" transform="rotate(60 60 60)"/>
            <ellipse cx="60" cy="60" rx="52" ry="18" stroke="#b388ff" opacity=".9" transform="rotate(120 60 60)"/>
          </g>
          <circle cx="60" cy="60" r="13" fill="url(#lg-core)"/>
          <circle class="orbiter o1" cx="112" cy="60" r="5" fill="#4cc9f0"/>
        </svg>
      </div>
      <h1 class="title">ATOMAMI</h1>
      <p class="tagline" data-i18n="tagline"></p>

      <div class="menu">
        <button class="btn primary" id="btn-online"><span class="ico">🌐</span><span data-i18n="playOnline"></span></button>
        <button class="btn" id="btn-ai"><span class="ico">🤖</span><span data-i18n="playAI"></span></button>
        <button class="btn" id="btn-local"><span class="ico">👥</span><span data-i18n="playLocal"></span></button>
        <button class="btn ghost" id="btn-rules"><span class="ico">📖</span><span data-i18n="howToPlay"></span></button>
      </div>
      <p class="install-hint" id="install-hint" data-i18n="installHint" hidden></p>
      <p class="install-hint" id="offline-note" data-i18n="offlineNote" hidden></p>
    </section>

    <!-- ============ ONLINE MENU ============ -->
    <section id="screen-online" class="screen">
      <header class="bar"><button class="icon-btn" data-back aria-label="Back">‹</button><h2 data-i18n="playOnline"></h2><span></span></header>
      <label class="field">
        <span data-i18n="yourName"></span>
        <input id="input-name" maxlength="16" autocomplete="nickname" autocapitalize="words" spellcheck="false">
      </label>
      <div class="panel">
        <button class="btn primary" id="btn-create"><span class="ico">✨</span><span data-i18n="createRoom"></span></button>
        <p class="hint" data-i18n="createHint"></p>
      </div>
      <div class="panel">
        <label class="field">
          <span data-i18n="roomCode"></span>
          <input id="input-code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD" inputmode="text">
        </label>
        <button class="btn" id="btn-join"><span class="ico">🔑</span><span data-i18n="joinRoom"></span></button>
      </div>
      <div class="panel">
        <button class="btn" id="btn-quick"><span class="ico">⚡</span><span data-i18n="quickMatch"></span></button>
        <p class="hint" data-i18n="quickHint"></p>
      </div>
      <p class="conn-status" id="conn-status"></p>
    </section>

    <!-- ============ AI MENU ============ -->
    <section id="screen-ai" class="screen">
      <header class="bar"><button class="icon-btn" data-back aria-label="Back">‹</button><h2 data-i18n="playAI"></h2><span></span></header>
      <div class="panel">
        <p class="hint" data-i18n="chooseLevel"></p>
        <button class="btn" data-level="easy"><span class="ico">🟢</span><span data-i18n="easy"></span></button>
        <button class="btn" data-level="normal"><span class="ico">🟡</span><span data-i18n="normal"></span></button>
        <button class="btn" data-level="hard"><span class="ico">🔴</span><span data-i18n="hard"></span></button>
        <p class="hint" id="ai-record"></p>
      </div>
    </section>

    <!-- ============ WAITING ROOM ============ -->
    <section id="screen-wait" class="screen">
      <header class="bar"><button class="icon-btn" id="btn-wait-back" aria-label="Back">‹</button><h2 data-i18n="waitingTitle"></h2><span></span></header>
      <div class="panel center">
        <p class="hint" id="wait-text"></p>
        <div class="room-code" id="wait-code">····</div>
        <button class="btn primary" id="btn-share"><span class="ico">📤</span><span data-i18n="shareInvite"></span></button>
        <button class="btn ghost" id="btn-copy"><span class="ico">🔗</span><span data-i18n="copyLink"></span></button>
        <div class="spinner" aria-hidden="true"></div>
      </div>
    </section>

    <!-- ============ GAME ============ -->
    <section id="screen-game" class="screen game">
      <header class="bar game-bar">
        <button class="icon-btn" id="btn-menu" aria-label="Menu">☰</button>
        <div class="status" id="status" aria-live="polite"></div>
        <button class="icon-btn" id="btn-emote" aria-label="Emote" hidden>😀</button>
      </header>

      <div class="player top" id="panel-top">
        <div class="who"><span class="dot"></span><span class="name"></span><span class="badge fusion" hidden></span><span class="badge off" data-i18n="offline" hidden></span></div>
        <div class="hand" id="hand-top"></div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board">
          <div class="cells" id="cells"></div>
          <div class="pieces" id="pieces"></div>
        </div>
        <div class="emote-pop" id="emote-pop"></div>
      </div>

      <div class="flux-row">
        <span class="flux-label" data-i18n="flux"></span>
        <div class="hand flux" id="flux"></div>
      </div>

      <div class="player bottom" id="panel-bottom">
        <div class="hand" id="hand-bottom"></div>
        <div class="who"><span class="dot"></span><span class="name"></span><span class="badge fusion" hidden></span><span class="badge off" data-i18n="offline" hidden></span></div>
      </div>

      <div class="emote-tray" id="emote-tray" hidden>
        <button>👍</button><button>😮</button><button>😂</button><button>🔥</button><button>😈</button><button>🤝</button>
      </div>
    </section>

  </div>

  <!-- ============ DIALOGS ============ -->
  <div class="overlay" id="overlay-rules" hidden>
    <div class="sheet">
      <header class="sheet-head"><h2 data-i18n="howToPlay"></h2><button class="icon-btn" data-close aria-label="Close">✕</button></header>
      <div class="sheet-body rules" id="rules-body"></div>
    </div>
  </div>

  <div class="overlay" id="overlay-menu" hidden>
    <div class="sheet small">
      <header class="sheet-head"><h2 data-i18n="menu"></h2><button class="icon-btn" data-close aria-label="Close">✕</button></header>
      <div class="sheet-body">
        <button class="btn" id="btn-m-rules"><span class="ico">📖</span><span data-i18n="howToPlay"></span></button>
        <button class="btn" id="btn-m-sound"><span class="ico">🔊</span><span data-i18n="toggleSound"></span></button>
        <button class="btn" id="btn-m-resign"><span class="ico">🏳️</span><span data-i18n="resign"></span></button>
        <button class="btn ghost" id="btn-m-exit"><span class="ico">🚪</span><span data-i18n="exitToMenu"></span></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay-end" hidden>
    <div class="sheet small end">
      <div class="end-burst" id="end-burst"></div>
      <h2 id="end-title"></h2>
      <p id="end-reason"></p>
      <div class="sheet-body">
        <button class="btn primary" id="btn-again"><span class="ico">🔁</span><span id="btn-again-label" data-i18n="playAgain"></span></button>
        <button class="btn ghost" id="btn-view"><span class="ico">👁️</span><span data-i18n="viewBoard"></span></button>
        <button class="btn ghost" id="btn-end-exit"><span class="ico">🚪</span><span data-i18n="exitToMenu"></span></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay-confirm" hidden>
    <div class="sheet small end">
      <h2 id="confirm-text"></h2>
      <div class="sheet-body">
        <button class="btn primary" id="btn-confirm-yes"><span data-i18n="yes"></span></button>
        <button class="btn ghost" id="btn-confirm-no"><span data-i18n="no"></span></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
